name: assistive_nav
description: "CNN-based assistive navigation for visually impaired users."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Live camera frames for the classifier
  camera: ^0.11.0+2

  # Runs the TFLite model on the phone.
  # 0.11.0 or newer is required - 0.10.x does not compile on Dart 3.5.
  tflite_flutter: ^0.11.0

  # Speaks detections aloud
  flutter_tts: ^4.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model/model_fp16.tflite
    - assets/model/labels.txt
